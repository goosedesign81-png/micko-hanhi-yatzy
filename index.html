<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Yatzy">
<title>Micko &amp; Hanhi · Yatzy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #0b0b0c;
    --label: #151516;
    --label-2: #1c1c1e;
    --gold-hi: #f6e3a4;
    --gold: #d6a955;
    --gold-lo: #8a6325;
    --gold-rule: rgba(214, 169, 85, .45);
    --silver: #aeb4bc;
    --cream: #f1eadb;
    --dice: #f7f2e6;
    --red: #d9735f;
    --gold-grad: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 48%, var(--gold-lo) 100%);
    --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
    --text: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; padding: 16px 8px 48px; color: var(--cream);
    font-family: var(--text); font-size: 15px; line-height: 1.5;
    background-color: var(--night);
    background-image: radial-gradient(circle at 50% 0%, #272319 0%, var(--night) 62%);
  }
  :focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }

  /* the frame: a black label with a double gold rule, like a printed band */
  .paper {
    max-width: 560px; margin: 0 auto;
    background: linear-gradient(180deg, #171718, #0f0f10);
    padding: 22px 16px 26px; border-radius: 4px;
    border: 1px solid var(--gold-rule);
    box-shadow: inset 0 0 0 4px var(--night), inset 0 0 0 5px var(--gold-rule), 0 20px 50px rgba(0, 0, 0, .6);
  }
  .masthead { text-align: center; border-bottom: 3px double var(--gold-rule); padding-bottom: 12px; margin-bottom: 16px; }
  h1 {
    font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.15;
    letter-spacing: .14em; text-transform: uppercase; margin: 0;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-family: var(--display); font-style: italic; font-size: 16px; color: var(--silver); margin-top: 6px; }
  .note { font-family: var(--display); font-style: italic; font-size: 14px; color: var(--silver); margin: 8px 0; text-align: center; }
  .center { text-align: center; }
  .small { font-family: var(--display); font-style: italic; font-size: 13px; color: var(--silver); }
  .turnline { font-family: var(--display); font-style: italic; font-size: 17px; color: var(--gold-hi); text-align: center; margin: 14px 0 6px; }
  .banner { font-family: var(--display); font-style: italic; color: var(--cream); }

  /* race to N game wins */
  .series { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pcell { border: 1px solid var(--gold-rule); padding: 12px 8px; text-align: center; background: var(--label-2); }
  .pcell.turn { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold), 0 0 22px rgba(214, 169, 85, .16); }
  .pname {
    font-size: 11px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--silver);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pwins {
    font-family: var(--display); font-weight: 700; font-size: 56px; line-height: 1; margin: 4px 0 2px;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .pgoal { font-size: 12px; color: var(--silver); letter-spacing: .04em; }
  .tally { min-height: 24px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; margin: 4px 0; }
  .grp { position: relative; display: inline-flex; gap: 3px; margin: 2px 9px 2px 0; height: 22px; align-items: center; }
  .grp i { display: inline-block; width: 2px; height: 20px; background: var(--gold); }
  .grp b { position: absolute; left: -3px; top: 10px; width: 30px; height: 2px; background: var(--gold); transform: rotate(-22deg); transform-origin: left center; }
  .stamp {
    display: inline-block; border: 2px solid var(--gold); color: var(--gold-hi); padding: 8px 18px;
    transform: rotate(-3deg); font-family: var(--display); font-weight: 700; letter-spacing: .2em;
    text-transform: uppercase; font-size: 16px; margin: 16px auto 0;
  }

  /* dice: ivory faces, black pips, so they read clearly on black */
  .die {
    display: inline-grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
    background: linear-gradient(145deg, #fffdf8, #e4dccb); border: 1px solid #8f8673;
    border-radius: 18%; vertical-align: middle; margin: 1px;
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .15), 0 2px 4px rgba(0, 0, 0, .5);
  }
  .die > span { display: block; }
  .die .pip { position: relative; }
  .die .pip::after { content: ''; position: absolute; inset: 18%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #555, #111 70%); }
  .die.q { display: inline-flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 700; line-height: 1; color: #1a1a1a; }

  /* buttons: gold plate for the main action, outlines for the rest */
  .big {
    display: block; width: 100%; max-width: 340px; margin: 16px auto 0; cursor: pointer;
    background: var(--gold-grad); color: #1a1408; border: none; border-radius: 3px;
    padding: 15px 12px; font-family: var(--text); font-size: 14px; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase;
    box-shadow: 0 3px 0 var(--gold-lo), 0 8px 18px rgba(0, 0, 0, .45);
  }
  .big:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gold-lo); }
  .big:disabled { opacity: .35; cursor: default; }
  .link {
    background: none; border: none; font-family: var(--text); font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--silver); text-decoration: underline; text-underline-offset: 3px;
    cursor: pointer; padding: 6px 8px;
  }
  .foot { margin-top: 16px; }
  .btn {
    font-family: var(--text); font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    background: transparent; color: var(--gold-hi); border: 1px solid var(--gold); border-radius: 3px;
    padding: 10px 16px; cursor: pointer;
  }
  .btn:disabled { opacity: .35; cursor: default; }

  .section-title {
    font-size: 11px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--gold);
    margin: 20px 0 8px; border-bottom: 1px solid var(--gold-rule); padding-bottom: 6px;
  }
  .field { margin: 14px 0; }
  .field label { display: block; font-size: 10px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--silver); margin-bottom: 4px; }
  .field input {
    width: 100%; background: transparent; border: none; border-radius: 0; border-bottom: 1px solid var(--gold);
    font-family: var(--display); font-size: 22px; color: var(--cream); padding: 4px 2px; outline: none;
  }
  .field input:focus { border-bottom-color: var(--gold-hi); box-shadow: 0 1px 0 var(--gold-hi); }
  .field input[type=file] { font-family: var(--text); font-size: 13px; border: none; color: var(--silver); padding: 6px 0; }
  .thumbline { width: 100%; max-height: 220px; object-fit: cover; margin-top: 8px; border: 1px solid var(--gold-rule); }

  /* the row popup: the same frame as the page */
  .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .74); display: flex; align-items: flex-start; justify-content: center; padding: 14px; overflow: auto; z-index: 10; }
  .sheetcard {
    background: linear-gradient(180deg, #171718, #0f0f10); width: 100%; max-width: 520px;
    padding: 18px 16px; border-radius: 4px; border: 1px solid var(--gold-rule); margin: auto 0;
    box-shadow: inset 0 0 0 4px var(--night), inset 0 0 0 5px var(--gold-rule), 0 20px 50px rgba(0, 0, 0, .7);
  }
  .mhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid var(--gold-rule); padding-bottom: 10px; }
  .who {
    font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: .08em; text-transform: uppercase;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .x { background: none; border: none; font-size: 20px; color: var(--silver); cursor: pointer; padding: 4px 8px; }
  .ptitle { text-align: center; margin: 14px 0 4px; }
  .faces { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
  .facebtn { position: relative; background: none; border: none; padding: 0; cursor: pointer; border-radius: 12%; }
  .facebtn:disabled { opacity: .3; cursor: default; }
  .facebtn:not(:disabled):active .die { transform: translateY(2px); }
  .facebtn.sel .die { box-shadow: 0 0 0 2px var(--night), 0 0 0 4px var(--gold), 0 2px 4px rgba(0, 0, 0, .5); }
  .hint { font-family: var(--display); font-style: italic; font-size: 15px; color: var(--silver); text-align: center; margin: 14px 0 10px; }
  .opt {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    padding: 10px 12px; margin-bottom: 6px; border: 1px solid rgba(214, 169, 85, .3); border-radius: 3px;
    background: var(--label-2); font-family: var(--text); font-size: 14px; color: var(--cream);
    cursor: pointer; text-align: left;
  }
  .opt:hover { border-color: var(--gold); background: #242427; }
  .opt .name { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .opt b {
    font-family: var(--display); font-size: 26px; font-weight: 700;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .opt b.zero { background: none; color: var(--red); font-size: 20px; }
  .mfoot { display: flex; justify-content: center; margin-top: 10px; }
  .step { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 4px 0; border-bottom: 1px solid rgba(214, 169, 85, .18); }
  .stepbtn {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--gold); background: transparent;
    font-family: var(--text); font-size: 22px; color: var(--gold-hi); cursor: pointer;
  }
  .stepbtn:disabled { opacity: .25; cursor: default; }
  .stepn { font-family: var(--display); font-weight: 700; font-size: 34px; min-width: 44px; text-align: center; color: var(--cream); }

  /* the sheet: gold rules on black, numbers in the serif */
  table.sheet { width: 100%; border-collapse: collapse; margin-top: 6px; }
  table.sheet th, table.sheet td { border: 1px solid rgba(214, 169, 85, .28); padding: 0 6px; height: 40px; }
  table.sheet th.cat { text-align: left; font-weight: normal; width: 44%; }
  table.sheet th.pl {
    font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
    color: var(--silver); text-align: center;
  }
  table.sheet th.pl.on { color: var(--gold-hi); background: rgba(214, 169, 85, .12); }
  table.sheet td {
    text-align: center; font-family: var(--display); font-size: 20px; font-weight: 600;
    color: var(--cream); min-width: 70px;
  }
  table.sheet td.blank { background: rgba(255, 255, 255, .015); }
  table.sheet td.blank.mine { background: rgba(214, 169, 85, .1); }
  table.sheet tr.open { cursor: pointer; }
  table.sheet tr.open:hover th.cat, table.sheet tr.open:hover td.blank { background: rgba(214, 169, 85, .16); }
  table.sheet tr.box th, table.sheet tr.box td { background: #1a1a1c; }
  table.sheet tr.box th b { font-size: 12px; font-weight: 700; letter-spacing: .22em; color: var(--gold); }
  table.sheet tr.box th small { font-family: var(--display); font-style: italic; font-size: 12px; color: var(--silver); }
  table.sheet tr.grand th, table.sheet tr.grand td { border-top: 2px double var(--gold-rule); }
  table.sheet tr.grand td {
    font-size: 28px; font-weight: 700; color: transparent;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text;
  }

  /* upper section: three of a kind silver, four or five gold, fewer than three red */
  table.sheet td.t-silver { color: var(--silver); font-weight: 700; }
  table.sheet td.t-gold { color: var(--gold-hi); font-weight: 700; text-shadow: 0 0 10px rgba(214, 169, 85, .45); }
  table.sheet td.t-red { color: #d5493e; font-weight: 700; }
  /* bonus box: a small counter up to 63, then the 50 */
  table.sheet td.progress { font-family: var(--text); font-size: 12px; letter-spacing: .04em; color: var(--silver); padding: 4px 6px 5px; }
  table.sheet td.progress span { display: block; }
  table.sheet td.progress .bar { height: 3px; margin-top: 5px; background: rgba(214, 169, 85, .18); }
  table.sheet td.progress .bar i { display: block; height: 100%; background: var(--gold); transition: width .4s ease; }
  table.sheet td.earned { color: var(--gold-hi); font-weight: 700; text-shadow: 0 0 12px rgba(214, 169, 85, .6); }

  /* the bonus celebration: shown once, the moment a player reaches 63 */
  .celebrate {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .62); cursor: pointer; overflow: hidden;
    animation: cel-out .5s ease 2.7s forwards;
  }
  .celebrate .cel-box { text-align: center; animation: cel-pop .6s cubic-bezier(.2, 1.3, .4, 1) both; }
  .celebrate .cel-title {
    font-family: var(--display); font-size: 30px; font-weight: 700; letter-spacing: .14em;
    color: var(--gold-hi); text-shadow: 0 0 24px rgba(214, 169, 85, .8);
  }
  .celebrate .cel-num {
    font-family: var(--display); font-size: 88px; font-weight: 700; line-height: 1.1;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .celebrate .cel-sub { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--silver); }
  .celebrate .spark {
    position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px; border-radius: 50%;
    background: var(--gold-hi); box-shadow: 0 0 10px var(--gold);
    animation: cel-spark 1.4s ease-out both;
  }
  @keyframes cel-pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes cel-spark { from { transform: translate(0, 0) scale(1.2); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  @keyframes cel-out { to { opacity: 0; visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    .celebrate .spark { display: none; }
    .celebrate .cel-box { animation: none; }
  }

  .cathead { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; }
  .cathead small { font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--silver); }
  .ptitle .cathead small { font-family: var(--display); font-style: italic; font-size: 22px; font-weight: 400; letter-spacing: .02em; text-transform: none; color: var(--cream); }
  .icons { white-space: nowrap; }

  .fin { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(214, 169, 85, .2); font-size: 14px; }
  .thumb { width: 44px; height: 44px; object-fit: cover; border-radius: 3px; border: 1px solid var(--gold-rule); flex: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* tabs: Play and Games */
  .tabs { display: flex; justify-content: center; gap: 28px; margin: 0 0 4px; }
  .tab {
    background: none; border: none; padding: 6px 2px; font-family: var(--text); font-size: 12px; font-weight: 600;
    letter-spacing: .24em; text-transform: uppercase; color: var(--silver); cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .tab.on { color: var(--gold-hi); border-bottom-color: var(--gold); }

  /* who goes first */
  .firstpick { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 6px 0 0; }
  .flabel { font-size: 10px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--silver); }
  .seg { display: flex; border: 1px solid var(--gold); border-radius: 3px; overflow: hidden; }
  .segbtn {
    background: transparent; border: none; padding: 9px 14px; font-family: var(--text); font-size: 12px;
    font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-hi); cursor: pointer;
  }
  .segbtn + .segbtn { border-left: 1px solid var(--gold); }
  .segbtn.on { background: var(--gold-grad); color: #1a1408; }

  /* top scores */
  .toprow { display: flex; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(214, 169, 85, .2); }
  .tpts {
    font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.1; min-width: 60px;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .tname { flex: 1; font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--cream); }
  .toprow .small { font-size: 13px; }

  /* game records */
  .gcard { border: 1px solid var(--gold-rule); background: var(--label-2); padding: 14px; margin: 14px 0; }
  .ghead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .gtitle {
    font-family: var(--display); font-weight: 700; font-size: 22px;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .gdate { font-family: var(--display); font-style: italic; font-size: 14px; color: var(--silver); }
  .gwhere { font-family: var(--display); font-size: 18px; margin-top: 6px; color: var(--cream); }
  .gresult { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-hi); margin-top: 8px; }
  .gmeta { font-size: 12px; color: var(--silver); margin-top: 2px; }
  .gimgs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .gimgs figure { margin: 0; flex: 1 1 150px; }
  .gimgs img { width: 100%; display: block; border: 1px solid var(--gold-rule); object-fit: cover; max-height: 240px; background: #000; }
  .gimgs img:not([src]) { min-height: 120px; }
  .gimgs figure.card img { object-fit: contain; max-height: 320px; }
  .gimgs figcaption { font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--silver); margin-top: 6px; }
  .gimgs figcaption a { color: var(--gold-hi); }
  .gnotes { font-family: var(--display); font-style: italic; color: var(--silver); margin: 10px 0 0; }

  /* the players' photos behind their score boxes */
  .pcell.photo {
    position: relative; min-height: 220px; padding: 0; overflow: hidden;
    background: #0b0b0c; border: 1px solid var(--gold-rule);
  }
  .pimg {
    position: absolute; inset: 0; background-size: cover; background-position: 50% 22%;
    filter: sepia(.3) contrast(1.08) brightness(.92);
  }
  .pshade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(11,11,12,.55) 0%, rgba(11,11,12,.08) 34%, rgba(11,11,12,.6) 66%, rgba(11,11,12,.96) 100%);
  }
  .pcell.photo .pname {
    position: absolute; top: 12px; left: 14px; right: 14px; text-align: left;
    color: var(--cream); font-size: 11px; letter-spacing: .24em;
    filter: drop-shadow(0 1px 4px rgba(0, 0, 0, .9));
  }
  .pcell.photo .pwins {
    position: absolute; left: 12px; bottom: 4px; margin: 0; font-size: 76px;
    filter: drop-shadow(0 2px 10px rgba(0, 0, 0, .75));
  }
  .pcell.photo.turn { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold), 0 0 24px rgba(214, 169, 85, .28); }
  .pcell.photo.turn::after {
    content: 'Rolls'; position: absolute; right: 12px; bottom: 14px;
    background: var(--gold-grad); color: #1a1408; font-size: 9px; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase; padding: 3px 7px; border-radius: 2px;
  }
</style>
</head>
<body>
<main id="app"></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>

const CATS = [
  ['ones', 'Ones'], ['twos', 'Twos'], ['threes', 'Threes'], ['fours', 'Fours'], ['fives', 'Fives'], ['sixes', 'Sixes'],
  ['onePair', 'One pair'], ['twoPairs', 'Two pairs'],

  ['smallStraight', 'Small straight'], ['largeStraight', 'Large straight'], ['chance', 'Chance'], ['yatzy', 'Yatzy']
];
const LABEL = Object.fromEntries(CATS);
const UPPER = CATS.slice(0, 6).map(c => c[0]);
const LOWER = CATS.slice(6).map(c => c[0]);
const FACE = { ones: 1, twos: 2, threes: 3, fours: 4, fives: 5, sixes: 6 };
const SINGULAR = { ones: 'one', twos: 'two', threes: 'three', fours: 'four', fives: 'five', sixes: 'six' };
const PLURAL = ['', 'ones', 'twos', 'threes', 'fours', 'fives', 'sixes'];
const FULL_HOUSE = 25, SMALL_STRAIGHT = 30, LARGE_STRAIGHT = 40, YATZY = 50;

// the dice drawn on each row of the sheet (chance is drawn with question marks)
const ICONS = {
  ones: [1, 1, 1, 1, 1], twos: [2, 2, 2, 2, 2], threes: [3, 3, 3, 3, 3],
  fours: [4, 4, 4, 4, 4], fives: [5, 5, 5, 5, 5], sixes: [6, 6, 6, 6, 6],
  onePair: [6, 6], twoPairs: [6, 6, 5, 5],
  threeKind: [3, 3, 3], fourKind: [4, 4, 4, 4], fullHouse: [5, 5, 5, 2, 2],
  smallStraight: [1, 2, 3, 4], largeStraight: [1, 2, 3, 4, 5], yatzy: [6, 6, 6, 6, 6]
};
const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- state ---------- */
function fresh() {
  return { started: false, players: ['Micko', 'Hanhi'], target: 100, game: null, finished: [], carry: null };
}
let S = fresh();
let db = null, authApi = null;
let synced = false;      // true once the shared copy has arrived
let signedIn = false;
let authChecked = false; // false until the sign-in state is known
let listening = false;
let lastText = '';       // the copy we last wrote or received; our own write comes back as an echo
let authEmail = '';
let authError = '';

// writes the whole series to the shared copy after each change. It is stored as one JSON
// text, so empty lists and blank boxes come back exactly as they were.
function save() {
  if (!db || !synced) return;
  const text = JSON.stringify(S);
  if (text === lastText) return;
  lastText = text;
  db.ref('state').set(text).catch(err => console.error('The series could not be saved', err));
}
function adopt(obj) {
  S = Object.assign(fresh(), obj);
  // games started before the boxes existed: add the new boxes; a game saved the old way is taken off the table
  if (S.game) {
    S.game.cards = S.game.cards.map(c => Object.assign(newCard(), c));
    if (S.game.done && !S.game.pending) S.game = null;
  }
}
function onState(snap) {
  const text = snap.val();
  if (synced && text === lastText) return;   // our own change, already on screen
  if (typeof text === 'string') { adopt(JSON.parse(text)); lastText = text; }
  else { adopt(fresh()); lastText = ''; }
  synced = true;
  render();
}
function onStateError(err) {
  console.error('The series could not be read', err);
  synced = false;
  authError = 'This account cannot open the series. Check the sign-in and the database rules.';
  render();
}
function listen() {
  if (listening) return;
  listening = true;
  db.ref('state').on('value', onState, onStateError);
}
// the row popup: { cat, counts[1..6], triple, pair, pairs } or null. Not saved.
let pop = null;
// which page is showing: 'play' or 'games'. Not saved.
let view = 'play';

/* ---------- series ---------- */
// games played before this app: their wins are carried into the series, their scores were not recorded
const SETUP_WINS = [4, 1];
const carriedWins = i => (S.carry && S.carry.wins[i]) || 0;
const totalGames = () => S.finished.length + (S.carry ? S.carry.games : 0);
const winsOf = i => S.finished.filter(f => f.winner === i).length + carriedWins(i);
const tiesOf = () => S.finished.filter(f => f.winner < 0).length;
function championIdx() {
  for (const i of [0, 1]) if (winsOf(i) >= S.target) return i;
  return null;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* ---------- scoring ---------- */
const newCard = () => Object.fromEntries(CATS.map(([k]) => [k, null]));
const filled = card => CATS.filter(([k]) => card[k] != null).length;
const upperSum = card => UPPER.reduce((s, k) => s + (card[k] ?? 0), 0);
function cardTotal(card) {
  const up = upperSum(card);
  const low = LOWER.reduce((s, k) => s + (card[k] ?? 0), 0);
  return up + (up >= 63 ? 50 : 0) + low;
}
const gameOver = g => g.cards.every(card => CATS.every(([k]) => card[k] != null));
const winnerOf = totals => totals[0] > totals[1] ? 0 : totals[1] > totals[0] ? 1 : -1;

// upper section: how many dice of that face were rolled decides the colour of the score
// three = silver, four or five = gold, fewer than three = red
const TONE_HEX = { 't-gold': '#d6a955', 't-silver': '#aeb4bc', 't-red': '#d5493e' };
function upperTone(key, v) {
  if (v == null) return '';
  const n = v / FACE[key];
  return n >= 4 ? 't-gold' : n === 3 ? 't-silver' : 't-red';
}
// the bonus is earned at 63 in the upper section. This remembers the last totals seen, so the
// celebration plays once, at the moment a player crosses 63, on whichever phone sees the change.
let bonusSeen = null;
function watchBonus() {
  const g = S.game;
  if (!g) { bonusSeen = null; return; }
  const up = g.cards.map(upperSum);
  if (bonusSeen && bonusSeen.game === g.n) {
    up.forEach((u, i) => { if (bonusSeen.up[i] < 63 && u >= 63) celebrate(i); });
  }
  bonusSeen = { game: g.n, up };
}
function celebrate(i) {
  document.querySelectorAll('.celebrate').forEach(el => el.remove());
  let sparks = '';
  for (let s = 0; s < 28; s++) {
    const a = (s / 28) * Math.PI * 2, d = 130 + Math.random() * 170;
    sparks += `<span class="spark" style="--dx:${(Math.cos(a) * d).toFixed(0)}px;--dy:${(Math.sin(a) * d).toFixed(0)}px;animation-delay:${(Math.random() * 0.2).toFixed(2)}s"></span>`;
  }
  const el = document.createElement('div');
  el.className = 'celebrate';
  el.innerHTML = `${sparks}<div class="cel-box"><div class="cel-title">63 reached</div><div class="cel-num">+50</div><div class="cel-sub">${esc(S.players[i])} earns the bonus</div></div>`;
  el.addEventListener('click', () => el.remove());
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3300);
}

// c[f] = how many dice show face f (index 0 unused)
const sumOf = c => [1, 2, 3, 4, 5, 6].reduce((s, f) => s + f * c[f], 0);
function kindPoints(cat, c) {
  const most = Math.max(...c.slice(1));
  if (cat === 'threeKind') return most >= 3 ? sumOf(c) : 0;
  if (cat === 'fourKind') return most >= 4 ? sumOf(c) : 0;
  if (cat === 'chance') return sumOf(c);
  return 0;
}

/* ---------- game actions ---------- */
function start() {
  const a = document.getElementById('p0').value.trim() || 'Micko';
  const b = document.getElementById('p1').value.trim() || 'Hanhi';
  let t = parseInt(document.getElementById('target').value, 10);
  if (!Number.isFinite(t) || t < 1) t = 100;
  const w0 = Math.max(0, parseInt(document.getElementById('w0').value, 10) || 0);
  const w1 = Math.max(0, parseInt(document.getElementById('w1').value, 10) || 0);
  S = fresh();
  Object.assign(S, {
    started: true, players: [a, b], target: t,
    carry: (w0 + w1) ? { wins: [w0, w1], games: w0 + w1 } : null
  });
  view = 'play';
  newGame();
}
function newGameState(n, starter) {
  return {
    n, starter, active: starter, cards: [newCard(), newCard()], moves: [],
    done: false, id: null, endedAt: null, scores: null, winner: null, pending: null, saved: false
  };
}
function newGame() {
  if (!S.started || championIdx() != null) return;
  const n = totalGames() + 1;
  S.game = newGameState(n, (n - 1) % 2);
  pop = null;
  save(); render();
}
// who goes first: only while the table is still empty
function setStarter(p) {
  const g = S.game;
  if (!g || g.done || g.moves.length) return;
  g.starter = p;
  g.active = p;
  save(); render();
}
function openRow(cat) {
  const g = S.game;
  if (!g || g.done || g.cards[g.active][cat] != null) return;
  pop = { cat, counts: [0, 0, 0, 0, 0, 0, 0], triple: null, pair: null, pairs: [] };
  render();
}
function stepDie(face, d) {
  if (!pop) return;
  const total = pop.counts.reduce((a, b) => a + b, 0);
  if (d > 0 && total >= 5) return;
  if (d < 0 && pop.counts[face] <= 0) return;
  pop.counts[face] += d;
  render();
}
// write pts into the active player's box for cat, then pass the turn
function score(cat, pts) {
  const g = S.game;
  if (!g || g.done) return;
  const card = g.cards[g.active];
  if (card[cat] != null) return;
  card[cat] = pts;
  g.moves.push({ p: g.active, cat });
  g.active = 1 - g.active;
  pop = null;
  if (gameOver(g)) {
    g.scores = g.cards.map(cardTotal);
    g.winner = winnerOf(g.scores);
    g.done = true;
    g.id = uid();
    g.endedAt = new Date().toISOString();
    g.pending = { place: '', notes: '', hasPhoto: false };
  }
  save(); render();
}
function undo() {
  const g = S.game;
  if (!g || !g.moves.length) return;
  if (g.done) {
    if (g.pending && g.pending.hasPhoto && g.id) photoDelete(g.id).catch(() => {});
    g.done = false;
    g.id = null;
    g.endedAt = null;
    g.scores = null;
    g.winner = null;
    g.pending = null;
  }
  const m = g.moves.pop();
  g.cards[m.p][m.cat] = null;
  g.active = m.p;
  pop = null;
  save(); render();
}
// Save score: keeps the game and a picture of its card, then clears the table
async function saveGame() {
  const g = S.game;
  if (!g || !g.done || g.saved) return;
  g.saved = true;
  const e = {
    id: g.id, n: g.n, scores: g.scores, winner: g.winner, cards: g.cards,
    starter: g.starter, turns: g.moves.length, date: g.endedAt,
    place: g.pending.place.trim(), notes: g.pending.notes.trim(),
    hasPhoto: g.pending.hasPhoto, hasCard: false
  };
  S.finished.push(e);
  S.game = null;
  view = 'play';
  newGame();   // starts the next game, or leaves the table clear when the series is over
  save(); render();
  try {
    const blob = await drawCard(e);
    await photoPut(e.id + '-card', blob);
    e.hasCard = true;
  } catch (err) {
    console.error('The scorecard picture could not be saved', err);
  }
  save(); render();
}
function newSeries() {
  if (!confirm('Erase this whole series, every game and every photo?')) return;
  const names = S.players, target = S.target;
  S = fresh();
  S.players = names;
  S.target = target;
  pop = null;
  view = 'play';
  photoClear().catch(() => {});
  save(); render();
}
async function onPhoto(file) {
  const g = S.game;
  if (!g || !g.done || g.saved) return;
  try {
    const blob = await shrink(file);
    await photoPut(g.id, blob);
    g.pending.hasPhoto = true;
    save();
  } catch (err) {
    alert('Could not save that photo.');
  }
  render();
}

/* ---------- photos (shared copy, one entry per photo) ---------- */
const photoCache = new Map();   // id -> promise of an object URL, or null when there is no photo
const blobToUri = blob => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.onerror = () => rej(r.error);
  r.readAsDataURL(blob);
});
async function photoPut(id, blob) {
  const uri = await blobToUri(blob);
  await db.ref('photos/' + id).set(uri);
  photoCache.delete(id);
}
function photoUrl(id) {
  if (!photoCache.has(id)) {
    photoCache.set(id, db.ref('photos/' + id).once('value')
      .then(snap => snap.val() ? fetch(snap.val()).then(r => r.blob()).then(b => URL.createObjectURL(b)) : null)
      .catch(() => { photoCache.delete(id); return null; }));
  }
  return photoCache.get(id);
}
// removes a game's winner photo and its scorecard picture
async function photoDelete(id) {
  await Promise.all([db.ref('photos/' + id).remove(), db.ref('photos/' + id + '-card').remove()]);
  photoCache.delete(id);
  photoCache.delete(id + '-card');
}
async function photoClear() {
  await db.ref('photos').remove();
  photoCache.clear();
}
function shrink(file, max = 1280) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('encode failed')), 'image/jpeg', 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('unreadable image')); };
    img.src = url;
  });
}
async function hydratePhotos() {
  for (const img of document.querySelectorAll('img[data-photo]')) {
    const url = await photoUrl(img.dataset.photo);
    if (url) img.src = url;
  }
  for (const a of document.querySelectorAll('a[data-photo-link]')) {
    const url = await photoUrl(a.dataset.photoLink);
    if (url) { a.href = url; a.download = a.dataset.name || 'scorecard.jpg'; }
  }
}

/* ---------- the scorecard picture ---------- */
function pathRound(k, x0, y0, w, h, r) {
  k.beginPath();
  k.moveTo(x0 + r, y0);
  k.arcTo(x0 + w, y0, x0 + w, y0 + h, r);
  k.arcTo(x0 + w, y0 + h, x0, y0 + h, r);
  k.arcTo(x0, y0 + h, x0, y0, r);
  k.arcTo(x0, y0, x0 + w, y0, r);
  k.closePath();
}
// a die with pips; face null draws a question-mark die
function drawDie(k, x0, y0, s, face) {
  k.fillStyle = '#f7f2e6'; k.strokeStyle = '#8f8673'; k.lineWidth = 1;
  pathRound(k, x0, y0, s, s, s * 0.18);
  k.fill(); k.stroke();
  if (!face) {
    k.fillStyle = '#1a1a1a';
    k.font = `700 ${Math.round(s * 0.8)}px "Bodoni Moda", Georgia, serif`;
    k.textAlign = 'center'; k.textBaseline = 'middle';
    k.fillText('?', x0 + s / 2, y0 + s / 2 + 1);
    return;
  }
  const cell = s / 3;
  k.fillStyle = '#111';
  for (const i of PIPS[face]) {
    k.beginPath();
    k.arc(x0 + (i % 3) * cell + cell / 2, y0 + Math.floor(i / 3) * cell + cell / 2, s * 0.075, 0, Math.PI * 2);
    k.fill();
  }
}
// the playcard as a picture: the same rows as the sheet, drawn on a black label
async function drawCard(e) {
  await Promise.all([
    document.fonts.load('700 40px "Bodoni Moda"').catch(() => {}),
    document.fonts.load('italic 400 20px "Bodoni Moda"').catch(() => {}),
    document.fonts.load('600 14px "Montserrat"').catch(() => {})
  ]);
  const W = 960, ROW = 44, TOP = 180, FOOT = 96;
  const rows = [
    ...UPPER.map(key => ({ k: key })),
    { sum: true },
    { bonus: true },
    ...LOWER.map(key => ({ k: key })),
    { grand: true }
  ];
  const H = TOP + ROW * rows.length + FOOT;
  const scale = 2;
  const c = document.createElement('canvas');
  c.width = W * scale; c.height = H * scale;
  const k = c.getContext('2d');
  k.scale(scale, scale);
  const GOLD = '#d6a955', GOLD_HI = '#f6e3a4', GOLD_LO = '#8a6325', CREAM = '#f1eadb', SILVER = '#aeb4bc';
  const RULE = 'rgba(214,169,85,.28)';
  const COLS = [40, 440, 680, 920];
  const SANS = 'Montserrat, Helvetica, Arial, sans-serif';
  const SERIF = '"Bodoni Moda", Georgia, serif';
  const text = (s, x0, y0, font, fill, align = 'left', spacing = '0px') => {
    k.font = font; k.fillStyle = fill; k.textAlign = align; k.textBaseline = 'middle';
    k.letterSpacing = spacing; k.fillText(s, x0, y0); k.letterSpacing = '0px';
  };

  // frame
  k.fillStyle = '#0b0b0c'; k.fillRect(0, 0, W, H);
  k.fillStyle = '#151516'; k.fillRect(14, 14, W - 28, H - 28);
  k.strokeStyle = 'rgba(214,169,85,.45)'; k.lineWidth = 2; k.strokeRect(14, 14, W - 28, H - 28);
  k.lineWidth = 1; k.strokeRect(26.5, 26.5, W - 53, H - 53);

  // title, subtitle, double rule
  const gr = k.createLinearGradient(0, 40, 0, 80);
  gr.addColorStop(0, GOLD_HI); gr.addColorStop(0.48, GOLD); gr.addColorStop(1, GOLD_LO);
  k.fillStyle = gr;
  k.font = `700 40px ${SERIF}`; k.textAlign = 'center'; k.textBaseline = 'middle';
  k.letterSpacing = '6px';
  k.fillText(`${S.players[0]} & ${S.players[1]}`.toUpperCase(), W / 2, 62);
  k.letterSpacing = '0px';
  const sub = `Game ${e.n} · ${fmtDate(e.date)}${e.place ? ' · ' + e.place : ''}`;
  text(sub, W / 2, 104, `italic 400 18px ${SERIF}`, SILVER, 'center');
  k.fillStyle = RULE; k.fillRect(40, 124, W - 80, 1); k.fillRect(40, 128, W - 80, 1);

  // player names, the winner's in gold
  [0, 1].forEach(i => {
    text(S.players[i].toUpperCase(), (COLS[i + 1] + COLS[i + 2]) / 2, 156, `700 14px ${SANS}`,
      e.winner === i ? GOLD_HI : SILVER, 'center', '3px');
  });

  const top = TOP;
  const bottom = top + ROW * rows.length;
  rows.forEach((r, idx) => {
    const y0 = top + idx * ROW;
    const yc = y0 + ROW / 2;
    if (r.sum || r.bonus) { k.fillStyle = '#1a1a1c'; k.fillRect(40, y0, W - 80, ROW); }
    if (r.grand) { k.fillStyle = '#1c1c1e'; k.fillRect(40, y0, W - 80, ROW); }
    k.fillStyle = r.grand ? GOLD : RULE;
    k.fillRect(40, y0, W - 80, r.grand ? 2 : 1);

    if (r.k) {
      const faces = r.k === 'chance' ? [null, null, null, null, null] : ICONS[r.k];
      const size = 24;
      faces.forEach((f, j) => drawDie(k, 60 + j * (size + 5), yc - size / 2, size, f));
      const nameX = 60 + faces.length * (size + 5) + 10;
      text(LABEL[r.k].toUpperCase(), nameX, yc, `600 13px ${SANS}`, SILVER, 'left', '2px');
    } else if (r.sum) {
      text('TOTAL', 60, yc, `700 13px ${SANS}`, GOLD, 'left', '3px');
    } else if (r.bonus) {
      text('BONUS', 60, yc, `700 13px ${SANS}`, GOLD, 'left', '3px');
      k.font = `700 13px ${SANS}`; k.letterSpacing = '3px';
      const bw = k.measureText('BONUS').width;
      k.letterSpacing = '0px';
      text('63 gives 50', 60 + bw + 12, yc, `italic 400 13px ${SERIF}`, SILVER);
    } else if (r.grand) {
      text('TOTAL', 60, yc, `700 16px ${SANS}`, GOLD, 'left', '3px');
    }

    for (let i = 0; i < 2; i++) {
      const card = e.cards[i];
      const cx = (COLS[i + 1] + COLS[i + 2]) / 2;
      let v = null, font = `600 24px ${SERIF}`, fill = CREAM;
      if (r.k) {
        v = card[r.k];
        if (v != null && UPPER.includes(r.k)) fill = TONE_HEX[upperTone(r.k, v)];
      }
      else if (r.sum) v = upperSum(card);
      else if (r.bonus) v = upperSum(card) >= 63 ? 50 : null;
      else if (r.grand) { v = cardTotal(card); font = `700 26px ${SERIF}`; fill = GOLD; }
      if (v != null) text(String(v), cx, yc, font, fill, 'center');
    }
  });

  // rules between the columns and under the last row
  k.fillStyle = RULE;
  [COLS[1], COLS[2]].forEach(x0 => k.fillRect(x0, top, 1, bottom - top));
  k.fillRect(40, bottom, W - 80, 1);

  text(resultText(e.scores, e.winner), W / 2, bottom + FOOT / 2, `italic 400 24px ${SERIF}`, GOLD_HI, 'center');

  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('picture failed')), 'image/jpeg', 0.92));
}

/* ---------- drawing ---------- */
function dieIcon(n, size = 14) {
  const on = PIPS[n] || [];
  let cells = '';
  for (let i = 0; i < 9; i++) cells += on.includes(i) ? '<span class="pip"></span>' : '<span></span>';
  return `<span class="die" style="width:${size}px;height:${size}px;padding:${(size * 0.12).toFixed(1)}px">${cells}</span>`;
}
function dieQ(size = 14) {
  return `<span class="die q" style="width:${size}px;height:${size}px;padding:${(size * 0.12).toFixed(1)}px;font-size:${Math.round(size * 0.75)}px">?</span>`;
}
// the label of a sheet row: its dice, then its name in small type
function catLabel(key) {
  const icons = key === 'chance'
    ? [1, 2, 3, 4, 5].map(() => dieQ(14)).join('')
    : ICONS[key].map(f => dieIcon(f, 14)).join('');
  return `<span class="cathead"><span class="icons">${icons}</span><small>${LABEL[key]}</small></span>`;
}
function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('en-GB', {
    weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
  });
}
function resultText(scores, winner) {
  if (winner < 0) return `Tie ${scores[0]} – ${scores[1]}`;
  const loser = 1 - winner;
  return `${S.players[winner]} won ${scores[winner]} – ${scores[loser]}, by ${scores[winner] - scores[loser]}`;
}
function seriesStrip() {
  const g = S.game;
  // the leader is listed first; the top only shows the score
  const order = [0, 1].sort((a, b) => winsOf(b) - winsOf(a) || a - b);
  const cells = order.map(i => {
    const turn = g && !g.done && g.active === i ? ' turn' : '';
    return `
      <div class="pcell photo${turn}">
        <div class="pimg" style="background-image:url('${PLAYER_PHOTO[i]}')"></div>
        <div class="pshade"></div>
        <div class="pname">${esc(S.players[i])}</div>
        <div class="pwins">${winsOf(i)}</div>
      </div>`;
  }).join('');
  const ties = tiesOf();
  return `
    <section class="series">${cells}</section>
    <p class="note">First to ${S.target} game wins · ${totalGames()} played${ties ? ` · ${ties} tie${ties > 1 ? 's' : ''}` : ''}</p>`;
}
function sheetTable(g) {
  const cards = g.cards;
  const active = g.done ? -1 : g.active;
  const row = key => {
    const open = active >= 0 && cards[active][key] == null;
    const cells = [0, 1].map(i => {
      const v = cards[i][key];
      if (v != null) return `<td${UPPER.includes(key) ? ` class="${upperTone(key, v)}"` : ''}>${v}</td>`;
      return `<td class="blank${i === active ? ' mine' : ''}"></td>`;
    }).join('');
    const attr = open ? ` class="open" data-act="open" data-cat="${key}"` : '';
    return `<tr${attr}><th class="cat">${catLabel(key)}</th>${cells}</tr>`;
  };
  const ups = [0, 1].map(i => upperSum(cards[i]));
  // the bonus box counts up to 63, then shows the 50
  const bonusCell = s => s >= 63
    ? '<td class="earned">50</td>'
    : `<td class="progress"><span>${s} / 63</span><div class="bar"><i style="width:${Math.min(100, (s / 63) * 100).toFixed(1)}%"></i></div></td>`;
  return `
    <table class="sheet">
      <thead><tr>
        <th class="cat"></th>
        ${[0, 1].map(i => `<th class="pl ${active === i ? 'on' : ''}">${esc(S.players[i])}</th>`).join('')}
      </tr></thead>
      <tbody>
        ${UPPER.map(row).join('')}
        <tr class="box"><th class="cat"><b>TOTAL</b></th>${ups.map(s => `<td>${s}</td>`).join('')}</tr>
        <tr class="box"><th class="cat"><b>BONUS</b> <small>63 gives 50</small></th>${ups.map(bonusCell).join('')}</tr>
        ${LOWER.map(row).join('')}
        <tr class="box grand"><th class="cat"><b>TOTAL</b></th>${[0, 1].map(i => `<td>${cardTotal(cards[i])}</td>`).join('')}</tr>
      </tbody>
    </table>`;
}
// who goes first: a choice until the first score is written
function firstPicker(g) {
  if (g.done) return '';
  if (g.moves.length) return `<p class="note">${esc(S.players[g.starter])} went first</p>`;
  return `
    <div class="firstpick">
      <span class="flabel">Goes first</span>
      <div class="seg">
        ${[0, 1].map(i => `<button class="segbtn${g.starter === i ? ' on' : ''}" data-act="first" data-p="${i}">${esc(S.players[i])}</button>`).join('')}
      </div>
    </div>`;
}
function finishPanel(g) {
  const p = g.pending;
  const w = g.winner;
  const willEnd = w >= 0 && winsOf(w) + 1 >= S.target;
  const photoLabel = w >= 0 ? `Photo of ${esc(S.players[w])}` : 'Photo';
  return `
    <div class="banner">${esc(resultText(g.scores, w))}</div>
    <div class="section-title">Save this game</div>
    <div class="field"><label>Where</label><input id="place" type="text" value="${esc(p.place)}" placeholder="e.g. Kellari, Helsinki"></div>
    <div class="field">
      <label>${photoLabel} (optional)</label>
      <input id="photo" type="file" accept="image/*">
      ${p.hasPhoto ? `<img class="thumbline" data-photo="${g.id}" alt="">` : ''}
    </div>
    <div class="field"><label>Notes (optional)</label><input id="notes" type="text" value="${esc(p.notes)}"></div>
    <div class="center"><button class="big" data-act="save-game">${willEnd ? 'Save score and end series' : 'Save score'}</button></div>
    <p class="hint">${willEnd
      ? 'This ends the series.'
      : `Saving keeps the score and a picture of the card, then clears the table for game ${g.n + 1}.`}</p>`;
}
function topScores() {
  const rows = [];
  for (const f of S.finished) f.scores.forEach((pts, i) => rows.push({ pts, who: S.players[i], n: f.n }));
  return rows.sort((a, b) => b.pts - a.pts || a.n - b.n).slice(0, 5);
}
// best single-game total for each player; on a tie the earlier game wins
function highestScores() {
  return S.players.map((who, i) => {
    let best = null;
    for (const f of S.finished) {
      if (best === null || f.scores[i] > best.pts) best = { pts: f.scores[i], n: f.n };
    }
    return { who, best };
  });
}
function gameCard(f) {
  const meta = [
    f.starter != null ? `${esc(S.players[f.starter])} went first` : '',
    f.turns ? `${f.turns} turns` : ''
  ].filter(Boolean).join(' · ');
  const photos = [];
  if (f.hasPhoto) {
    const who = f.winner >= 0 ? `Photo of ${esc(S.players[f.winner])}` : 'Photo';
    photos.push(`<figure><img data-photo="${f.id}" alt="${who}"><figcaption>${who}</figcaption></figure>`);
  }
  if (f.hasCard) {
    photos.push(`<figure class="card"><img data-photo="${f.id}-card" alt="Scorecard"><figcaption><a data-photo-link="${f.id}-card" data-name="game-${f.n}-scorecard.jpg">Save scorecard picture</a></figcaption></figure>`);
  }
  return `
    <article class="gcard">
      <div class="ghead"><span class="gtitle">Game ${f.n}</span><span class="gdate">${esc(fmtDate(f.date))}</span></div>
      <div class="gwhere">${f.place ? esc(f.place) : 'No place given'}</div>
      <div class="gresult">${esc(resultText(f.scores, f.winner))}</div>
      ${meta ? `<div class="gmeta">${meta}</div>` : ''}
      ${photos.length ? `<div class="gimgs">${photos.join('')}</div>` : ''}
      ${f.notes ? `<p class="gnotes">${esc(f.notes)}</p>` : ''}
    </article>`;
}
function carryNote() {
  if (!S.carry || !S.carry.games) return '';
  const [w0, w1] = S.carry.wins;
  return `<p class="note">Before this app: ${S.carry.games} games, ${esc(S.players[0])} ${w0} – ${w1} ${esc(S.players[1])}. Scores were not recorded.</p>`;
}
function gamesView() {
  const carried = carryNote();
  if (!S.finished.length) {
    return `${carried}
      <div class="section-title">Games</div>
      <p class="hint">No games saved yet. Finish a game and tap Save score.</p>`;
  }

    <div class="toprow">
      <span class="tpts">${h.best ? h.best.pts : '–'}</span>
      <span class="tname">${esc(h.who)}</span>
      <span class="small">${h.best ? `Game ${h.best.n}` : ''}</span>
    </div>`).join('');
  const cards = [...S.finished].reverse().map(gameCard).join('');
  return `${carried}
    <div class="section-title">Top scores</div>

    <div class="section-title">Highest score per player</div>

    <div class="section-title">Games</div>

}

function mainView() {
  if (view === 'games') return gamesView();
  const g = S.game;
  const champ = championIdx();
  if (!g) {
    const end = champ != null
      ? `<div class="center"><div class="stamp">${esc(S.players[champ])} wins the series</div></div>`
      : `<div class="center"><button class="big" data-act="new-game">Start game ${totalGames() + 1}</button></div>`;

  }

    ${sheetTable(g)}

    ${footer()}`;
}
function footer() {
  const g = S.game;
  const undoLink = g && g.moves.length ? `<button class="link" data-act="undo">Undo last score</button>` : '';
  return `<div class="center foot">${undoLink}<button class="link" data-act="new-series">Start a new series</button></div>`;
}

/* ---------- the row popup ---------- */
// Ones to Sixes: how many of that face
function upperBody(cat) {
  const f = FACE[cat];
  const word = LABEL[cat].toLowerCase();
  const opts = [0, 1, 2, 3, 4, 5].map(n => {
    const pts = n * f;
    const dice = Array(n).fill(0).map(() => dieIcon(f, 18)).join('');
    const txt = n === 0 ? 'None' : `${n} × ${n === 1 ? SINGULAR[cat] : word}`;
    return `
      <button class="opt" data-act="pick" data-pts="${pts}">
        <span class="name">${dice}<span>${txt}</span></span>
        <b class="${pts ? '' : 'zero'}">${pts}</b>
      </button>`;
  }).join('');
  return `<p class="hint">How many ${word} did you roll?</p>${opts}`;
}
// Three of a kind, four of a kind, chance: how many dice show each face
function diceBody(cat) {
  const c = pop.counts;
  const total = c.reduce((a, b) => a + b, 0);
  const ok = total === 5;
  const pts = ok ? kindPoints(cat, c) : 0;
  const rows = [1, 2, 3, 4, 5, 6].map(f => `
    <div class="step">
      ${dieIcon(f, 30)}
      <button class="stepbtn" data-act="step" data-face="${f}" data-d="-1" aria-label="One fewer ${f}" ${c[f] ? '' : 'disabled'}>−</button>
      <span class="stepn">${c[f]}</span>
      <button class="stepbtn" data-act="step" data-face="${f}" data-d="1" aria-label="One more ${f}" ${total >= 5 ? 'disabled' : ''}>+</button>
    </div>`).join('');
  const hint = ok ? 'All five dice are set.' : `${total} of 5 dice set. Add the rest.`;
  const write = ok
    ? `<button class="big" data-act="pick" data-pts="${pts}">${pts ? `Write ${pts} points` : 'Write 0 (cross it out)'}</button>`
    : `<button class="big" disabled>Set all five dice</button>`;
  return `
    <p class="hint">How many of each face did you roll?</p>
    ${rows}
    <p class="hint">${hint}</p>
    ${write}
    <div class="mfoot"><button class="btn" data-act="clear" ${total ? '' : 'disabled'}>Clear</button></div>`;
}
// One pair: which pair. A pair scores twice its face.
function pairBody() {
  const opts = [6, 5, 4, 3, 2, 1].map(f => `
    <button class="opt" data-act="pick" data-pts="${2 * f}">
      <span class="name">${dieIcon(f, 20)}${dieIcon(f, 20)}<span>Pair of ${PLURAL[f]}</span></span>
      <b>${2 * f}</b>
    </button>`).join('');
  return `
    <p class="hint">Which pair did you roll?</p>
    ${opts}
    <button class="opt" data-act="pick" data-pts="0">
      <span class="name"><span>No pair</span></span>
      <b class="zero">0</b>
    </button>`;
}
// Two pairs: tap the two faces you have a pair of. Scores twice each face.
function twoPairsBody() {
  const faces = [1, 2, 3, 4, 5, 6].map(f => {
    const sel = pop.pairs.includes(f) ? ' sel' : '';
    return `<button class="facebtn${sel}" data-act="tp" data-face="${f}" aria-label="pair of ${PLURAL[f]}">${dieIcon(f, 44)}</button>`;
  }).join('');
  const ready = pop.pairs.length === 2;
  const pts = ready ? 2 * (pop.pairs[0] + pop.pairs[1]) : 0;
  const left = 2 - pop.pairs.length;
  const write = ready
    ? `<button class="big" data-act="pick" data-pts="${pts}">Write ${pts} points</button>`
    : `<button class="big" disabled>${left === 2 ? 'Pick two faces' : 'Pick one more face'}</button>`;
  return `
    <p class="hint">Which two pairs did you roll? Tap the two faces.</p>
    <div class="faces">${faces}</div>
    ${write}
    <div class="mfoot"><button class="btn" data-act="pick" data-pts="0">No two pairs · write 0</button></div>`;
}
// Full house: which three, and which pair
function fullHouseBody() {
  const faces = key => [1, 2, 3, 4, 5, 6].map(f => {
    const sel = pop[key] === f ? ' sel' : '';
    const dis = key === 'pair' && pop.triple === f ? ' disabled' : '';
    return `<button class="facebtn${sel}" data-act="fh-${key}" data-face="${f}" aria-label="${key} of ${f}"${dis}>${dieIcon(f, 44)}</button>`;
  }).join('');
  const ready = pop.triple && pop.pair;
  const write = ready
    ? `<button class="big" data-act="pick" data-pts="${FULL_HOUSE}">Write ${FULL_HOUSE} points</button>`
    : `<button class="big" disabled>Pick the three and the pair</button>`;
  return `
    <p class="hint">Which full house did you roll?</p>
    <div class="section-title">Three of</div>
    <div class="faces">${faces('triple')}</div>
    <div class="section-title">and a pair of</div>
    <div class="faces">${faces('pair')}</div>
    ${write}
    <div class="mfoot"><button class="btn" data-act="pick" data-pts="0">No full house · write 0</button></div>`;
}
// Small and large straight: which run
function straightBody(cat) {
  const small = cat === 'smallStraight';
  const runs = small ? [[1, 2, 3, 4], [2, 3, 4, 5], [3, 4, 5, 6]] : [[1, 2, 3, 4, 5], [2, 3, 4, 5, 6]];
  const pts = small ? SMALL_STRAIGHT : LARGE_STRAIGHT;
  const name = small ? 'small straight' : 'large straight';
  const opts = runs.map(run => `
    <button class="opt" data-act="pick" data-pts="${pts}">
      <span class="name">${run.map(f => dieIcon(f, 20)).join('')}</span>
      <b>${pts}</b>
    </button>`).join('');
  return `
    <p class="hint">Which ${name} did you roll?</p>
    ${opts}
    <button class="opt" data-act="pick" data-pts="0">
      <span class="name"><span>Not a ${name}</span></span>
      <b class="zero">0</b>
    </button>`;
}
// Yatzy: which number came up five times
function yatzyBody() {
  const faces = [1, 2, 3, 4, 5, 6].map(f =>
    `<button class="facebtn" data-act="pick" data-pts="${YATZY}" aria-label="Five ${f}s">${dieIcon(f, 48)}</button>`
  ).join('');
  return `
    <p class="hint">Which number did you roll five of? Yatzy scores ${YATZY}.</p>
    <div class="faces">${faces}</div>
    <div class="mfoot"><button class="btn" data-act="pick" data-pts="0">No Yatzy · write 0</button></div>`;
}
function popupBody(cat) {
  if (FACE[cat]) return upperBody(cat);
  if (cat === 'threeKind' || cat === 'fourKind' || cat === 'chance') return diceBody(cat);
  if (cat === 'onePair') return pairBody();
  if (cat === 'twoPairs') return twoPairsBody();
  if (cat === 'fullHouse') return fullHouseBody();
  if (cat === 'yatzy') return yatzyBody();
  return straightBody(cat);
}
function popupHtml() {
  const g = S.game;
  if (!pop || !g || g.done) return '';
  const card = g.cards[g.active];
  return `
    <div class="overlay">
      <div class="sheetcard">
        <div class="mhead">
          <span class="who">${esc(S.players[g.active])}</span>
          <span class="note" style="margin:0">round ${filled(card) + 1} of ${CATS.length}</span>
          <button class="x" data-act="close" aria-label="Close">✕</button>
        </div>
        <div class="ptitle">${catLabel(pop.cat)}</div>
        ${popupBody(pop.cat)}
      </div>
    </div>`;
}

function render() {
  const gate = gateView();
  if (gate) {
    document.getElementById('app').innerHTML = `
      <div class="paper">
        <header class="masthead"><h1>Micko &amp; Hanhi</h1><div class="sub">Yatzy with dice</div></header>
        ${gate}
      </div>`;
    return;
  }
  const title = S.started ? `${esc(S.players[0])} &amp; ${esc(S.players[1])}` : 'Micko &amp; Hanhi';
  const sub = S.started ? `Race to ${S.target} game wins` : 'Yatzy with dice';
  const body = S.started ? mainView() : setupView();
  const tabs = S.started
    ? `<nav class="tabs">${[['play', 'Play'], ['games', 'Games']].map(([v, label]) =>
        `<button class="tab${view === v ? ' on' : ''}" data-act="view" data-view="${v}">${label}</button>`).join('')}</nav>`
    : '';
  document.getElementById('app').innerHTML = `
    <div class="paper">
      <header class="masthead"><h1>${title}</h1><div class="sub">${sub}</div></header>
      ${tabs}
      ${body}
    </div>
    ${popupHtml()}`;
  hydratePhotos();
  watchBonus();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target.classList && e.target.classList.contains('overlay')) { pop = null; return render(); }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  switch (el.dataset.act) {
    case 'start': return start();
    case 'new-game': return newGame();
    case 'view': view = el.dataset.view; return render();
    case 'first': return setStarter(Number(el.dataset.p));
    case 'open': return openRow(el.dataset.cat);
    case 'close': pop = null; return render();
    case 'step': return stepDie(Number(el.dataset.face), Number(el.dataset.d));
    case 'clear': if (pop) pop.counts = [0, 0, 0, 0, 0, 0, 0]; return render();
    case 'fh-triple':
      if (!pop) return;
      pop.triple = Number(el.dataset.face);
      if (pop.pair === pop.triple) pop.pair = null;
      return render();
    case 'fh-pair':
      if (!pop) return;
      pop.pair = Number(el.dataset.face);
      return render();
    case 'tp': {
      if (!pop) return;
      const f = Number(el.dataset.face);
      const at = pop.pairs.indexOf(f);
      if (at >= 0) pop.pairs.splice(at, 1);
      else if (pop.pairs.length < 2) pop.pairs.push(f);
      return render();
    }
    case 'pick': return pop && score(pop.cat, Number(el.dataset.pts));
    case 'save-game': return saveGame();
    case 'undo': return undo();
    case 'new-series': return newSeries();
    case 'signin': return signIn();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'email') { authEmail = e.target.value; return; }
  const g = S.game;
  if (!g || !g.pending || g.saved) return;
  if (e.target.id === 'place') { g.pending.place = e.target.value; save(); }
  if (e.target.id === 'notes') { g.pending.notes = e.target.value; save(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'photo' && e.target.files && e.target.files[0]) onPhoto(e.target.files[0]);
});

/* ---------- sign-in and the shared series ---------- */
// what to show instead of the series: setup, sign-in, or loading. null when the series can be shown.
function gateView() {
  if (!FIREBASE_READY) {
    return `<section><div class="section-title">Not set up yet</div>
      <p class="hint">The shared storage settings are missing from this page.</p></section>`;
  }
  if (typeof firebase === 'undefined') {
    return `<section><div class="section-title">Could not load</div>
      <p class="hint">The shared storage did not load. Check the connection and open the page again.</p></section>`;
  }
  if (!authChecked) return `<section><p class="hint">Loading…</p></section>`;
  if (!signedIn) {
    return `
      <section>
        <div class="section-title">Sign in</div>
        <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" value="${esc(authEmail)}"></div>
        <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
        <p class="hint">${esc(authError)}</p>
        <div class="center"><button class="big" data-act="signin">Sign in</button></div>
      </section>`;
  }
  if (!synced) {
    return `<section><p class="hint">${esc(authError) || 'Loading the series…'}</p></section>`;
  }
  return null;
}
async function signIn() {
  const email = authEmail.trim();
  const pw = (document.getElementById('password') || {}).value || '';
  if (!email || !pw) { authError = 'Type your email and password.'; return render(); }
  authError = '';
  try {
    await authApi.signInWithEmailAndPassword(email, pw);
  } catch (err) {
    authError = 'That email and password did not match.';
    render();
  }
}
function connectShared() {
  render();
  if (!FIREBASE_READY || typeof firebase === 'undefined') return;
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.database();
  authApi = firebase.auth();
  authApi.onAuthStateChanged(user => {
    authChecked = true;
    signedIn = !!user;
    if (user) { authError = ''; listen(); }
    render();
  });
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'password') signIn();
});

// lets the browser offer 'Install app'; it keeps no copies, so the page always loads fresh
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

connectShared();
</script>
</body>
</html>
